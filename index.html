<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Balloon Pop</title>
  <style>
    :root {
      --bg: #ffffff;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      /* No page scroll, pinch-zoom or text selection while dragging the bow. */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      outline: none;
    }
    #error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #222;
      font: 16px/1.5 system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- The game: build/balloonGame.riv, signed (rive . --publish) and copied
       next to this page as balloonGame.riv. Serve the folder over http(s);
       opening the file straight from disk won't load the .riv. -->
  <canvas id="game" tabindex="0"></canvas>
  <div id="error">The game couldn't load.</div>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2/rive.js"></script>
  <script>
    const canvas = document.getElementById('game');

    const r = new rive.Rive({
      src: 'balloonGame.riv',
      canvas,
      artboard: 'Artboard',
      stateMachines: 'State Machine 1',
      autoplay: true,
      autoBind: true,
      // Lets the file's url event open the portfolio link on the game-over
      // screen (in a new tab).
      automaticallyHandleEvents: true,
      // Portrait 1080x1920 artboard, letterboxed to fit any window.
      layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        // The game picks English or Portuguese from the host's language.
        const vm = r.viewModelInstance;
        const locale = vm && vm.string('locale');
        if (locale) locale.value = navigator.language || 'en';
        canvas.focus();
      },
      onLoadError: (e) => {
        console.error(e);
        document.getElementById('error').style.display = 'flex';
      },
    });

    // iPhones mute web audio while the ring/silent switch is on silent. Asking
    // for a "playback" session (like a video) makes the game audible anyway:
    // directly where Safari supports it, otherwise by playing a moment of
    // silence through an audio element on the first tap.
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    const silence = new Audio('data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA');
    silence.loop = true;
    const unlockAudio = () => {
      silence.play().catch(() => {});
      ['touchend', 'click', 'keydown'].forEach((t) => document.removeEventListener(t, unlockAudio, true));
    };
    ['touchend', 'click', 'keydown'].forEach((t) => document.addEventListener(t, unlockAudio, true));

    window.addEventListener('resize', () => r.resizeDrawingSurfaceToCanvas());

    // Diagnostics, shown only with ?debug in the address: the state of the
    // game's audio engine, plus a plain beep to check the phone plays web audio.
    if (location.search.includes('debug')) {
      const panel = document.createElement('div');
      panel.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;padding:8px;background:rgba(0,0,0,.8);' +
        'color:#0f0;font:12px/1.4 monospace;white-space:pre-wrap;z-index:9;pointer-events:auto';
      const beep = document.createElement('button');
      beep.textContent = 'Test beep';
      beep.style.cssText = 'font:14px system-ui;padding:6px 12px;margin-bottom:6px';
      beep.addEventListener('click', () => {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
        log.push('beep: context ' + ctx.state);
      });
      const text = document.createElement('div');
      panel.append(beep, text);
      document.body.append(panel);
      const log = [];
      ['touchend', 'click', 'pointerdown'].forEach((t) =>
        document.addEventListener(t, () => { log.push(t); if (log.length > 6) log.shift(); }, true));
      setInterval(() => {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ma = window.miniaudio;
        const devices = ma && ma.devices ? ma.devices.filter(Boolean) : [];
        const states = devices.map((d) => {
          const ctx = Object.values(d).find((v) => v instanceof Ctx);
          return ctx ? ctx.state + ' @' + ctx.sampleRate : 'no context';
        });
        text.textContent = [
          navigator.userAgent.replace(/^Mozilla\/5.0 /, ''),
          'audioSession: ' + (navigator.audioSession ? navigator.audioSession.type : 'n/a'),
          'silence element: ' + (silence.paused ? 'paused' : 'playing'),
          'engine: ' + (ma ? devices.length + ' device(s): ' + states.join(', ') : 'not created'),
          'rive volume: ' + r.volume,
          'events: ' + log.join(' '),
        ].join('\n');
      }, 500);
    }
    // Keys (R, Z, L, S) go to the game while the canvas has focus.
    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
